# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [ pull_request, push ]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
            21    # Required by Fabric Loom 1.11.x
        ]
        # and run on Linux
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: resolve artifact name
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }}
        id: vars
        run: |
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          mod_version=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2)
          artifact_name="Origins-Planeswalker-Reborn-mc${mc_version}-${mod_version}.jar"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: prepare mod jar
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }}
        run: |
          jar=$(ls build/libs/*.jar | grep -vE '(sources|dev|javadoc)\.jar$' | head -n 1)
          cp "${jar}" "build/libs/${{ steps.vars.outputs.artifact_name }}"
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/${{ steps.vars.outputs.artifact_name }}
